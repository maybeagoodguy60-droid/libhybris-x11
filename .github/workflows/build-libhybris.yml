name: Build libhybris

on:
  workflow_dispatch:
  push:
    branches:
      - x11-generic-wsi
    paths:
      - 'hybris/**'
      - 'android-headers/**'
      - 'glxshim/**'
      - '.github/workflows/build-libhybris.yml'

permissions:
  contents: read

jobs:
  build:
    name: Cross-build aarch64 libhybris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libhybris is a glibc-side cross build, so the compiler and the
      # pkg-config results both have to be aarch64. The runner only has
      # x86_64 packages, so arm64 is added to apt and every -dev package we
      # need is pulled in explicitly with the :arm64 suffix.
      # The runner's default sources point at azure.archive.ubuntu.com, which
      # carries no arm64 Packages index, so apt silently Ign: every arm64
      # lookup. Replace them outright and take amd64 from archive and arm64
      # from ports, which is where Ubuntu actually publishes arm64.
      - name: Enable arm64 packages
        run: |
          sudo dpkg --add-architecture arm64
          sudo mv /etc/apt/sources.list.d/ubuntu.sources \
                   /etc/apt/sources.list.d/ubuntu.sources.disabled
          sudo rm -f /etc/apt/sources.list.d/arm64.list
          sudo tee /etc/apt/sources.list.d/cross.list >/dev/null <<'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-security main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool libtool-bin pkg-config file patchelf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libc6-arm64-cross linux-libc-dev-arm64-cross \
            libwayland-dev:arm64 libwayland-egl-backend-dev:arm64 \
            libx11-dev:arm64 libx11-xcb-dev:arm64 \
            libxcb1-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 \
            libvulkan-dev:arm64 wayland-protocols
          echo "--- sanity: aarch64 .pc files resolve ---"
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            pkg-config --exists wayland-client x11 xcb-dri3 xcb-present && echo "pkg-config OK"

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: hybris/build
          key: libhybris-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            libhybris-${{ runner.os }}-

      - name: Configure
        working-directory: hybris
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          ./autogen.sh
          ./configure \
            --host=aarch64-linux-gnu \
            --prefix=/usr/lib/hybris \
            --libdir=/usr/lib/hybris \
            --with-android-headers="$GITHUB_WORKSPACE/android-headers" \
            --enable-arch=arm64 \
            --enable-wayland \
            --enable-x11 \
            --disable-wayland_serverside_buffers \
            --enable-adreno-quirks \
            --enable-mali-quirks \
            --enable-property-cache \
            --with-default-vulkan-platform=x11 \
            --with-default-hybris-ld-library-path=/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/apex/com.android.runtime/lib64 \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            'CPPFLAGS=-idirafter /usr/include'

      - name: Build
        working-directory: hybris
        run: make -j"$(nproc)"

      - name: Sanity-check the cross output
        run: |
          file hybris/vulkan/.libs/libvulkan.so.1.2.183 2>/dev/null || \
          file hybris/vulkan/.libs/libvulkan.so.1.*
          file hybris/.libs/libEGL.so.1.0.0
          readelf -d hybris/egl/platforms/x11/.libs/eglplatform_x11.so | grep -i needed | head -5

      # Ship the DESTDIR install as a symlink-preserving tar, the same shape
      # the Android app extracts at runtime. .la files, .pc files and headers
      # all reference host paths, so they are stripped.
      - name: Package
        working-directory: hybris
        run: |
          make DESTDIR="$GITHUB_WORKSPACE/hybris/build/stage" install
          # The GLX->GLES shim is compiled on-device rather than here: it
          # includes the EGL/GLES3 headers, and those are only present in the
          # runtime chroot, not in this cross-build environment. Ship the
          # source and its Makefile so the packaging step can build it.
          mkdir -p build/stage/usr/lib/hybris/glxshim
          cp "$GITHUB_WORKSPACE"/glxshim/glxshim.c \
             "$GITHUB_WORKSPACE"/glxshim/Makefile \
             build/stage/usr/lib/hybris/glxshim/
          cd build/stage/usr/lib/hybris
          tar --format=ustar \
            --exclude='*.la' --exclude='pkgconfig' --exclude='include' --exclude='bin' \
            -czf "$GITHUB_WORKSPACE/libhybris-arm64.tar.gz" .
          ls -la "$GITHUB_WORKSPACE/libhybris-arm64.tar.gz"

      - name: Verify the artefacts we depend on are present
        run: |
          set -e
          T=$(mktemp -d)
          tar xzf libhybris-arm64.tar.gz -C "$T"
          # gl-shims/ is deliberately not in this list: it ships from the
          # tawc-portable packaging, not from libhybris itself, and the
          # libGL.so.1 there is just a symlink onto libGLESv2.
          for f in \
            libEGL.so.1 libGLESv1_CM.so.1 libGLESv2.so.2 libvulkan.so.1 \
            libhybris-common.so.1 libhybris/linker/q.so \
            libhybris/eglplatform_x11.so libhybris/eglplatform_wayland.so \
            libhybris/vulkanplatform_x11.so libhybris/vulkanplatform_wayland.so \
            glxshim/glxshim.c glxshim/Makefile
          do
            test -e "$T/$f" || { echo "MISSING: $f"; exit 1; }
            echo "  ok  $f"
          done
          echo "--- tree ---"
          find "$T" -maxdepth 2 -name '*.so*' | sed "s|$T/||" | sort | head -30

      - name: Checksums
        run: sha256sum libhybris-arm64.tar.gz > sha256sums.txt && cat sha256sums.txt

      - name: Upload libhybris
        uses: actions/upload-artifact@v4
        with:
          name: libhybris-arm64
          path: |
            libhybris-arm64.tar.gz
            sha256sums.txt
          retention-days: 90
